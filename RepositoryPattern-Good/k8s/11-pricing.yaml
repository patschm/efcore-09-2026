# Pricing: structurally identical to Catalog (see 10-catalog.yaml for what every field here
# means) - a different bounded context, but the same shape of Deployment/Service pair, same
# health-check wiring, same resource sizing. This is normal and expected: most services in a
# system like this ARE mostly boilerplate at the infrastructure level, with all the actual
# differences living in the application code, not the manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: webshop
  labels:
    app: pricing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pricing
      # See 10-catalog.yaml for what these mean.
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "pricing"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: pricing
          image: psrepo.azurecr.io/webshop-pricing:v7-cosmos
          ports:
            - name: http
              containerPort: 8080
          env:
            # Postgres wiring - commented out, not deleted (see 10-catalog.yaml for the full
            # explanation of this pattern). Pricing now runs on Cosmos.
            # - name: ConnectionStrings__Pricing
            #   valueFrom:
            #     secretKeyRef:
            #       name: webshop-postgres-connections
            #       key: ConnectionStrings__Pricing
            - name: CosmosDb__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: webshop-cosmos-connection
                  key: CosmosDb__ConnectionString
          envFrom:
            - configMapRef:
                name: webshop-common-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: webshop
spec:
  type: ClusterIP
  selector:
    app: pricing
  ports:
    - name: http
      port: 8080
      targetPort: http
