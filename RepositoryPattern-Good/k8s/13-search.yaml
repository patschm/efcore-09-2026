# Search: same shape as Catalog/Pricing/Reviews (see 10-catalog.yaml), plus one new thing - it
# calls the embedding container (14-embedding.yaml) over plain HTTP, via that Service's
# cluster-DNS name. "embedding.webshop.svc.cluster.local" is Kubernetes' full internal DNS name
# for "the Service called embedding, in the namespace webshop" - every Pod in the cluster can
# resolve that, in any namespace. The short form "http://embedding:8000" (what's actually used
# below, matching Search/Api/appsettings.json's Embedding:Url shape) also works, but ONLY because
# Search's own Pods live in the SAME namespace as the embedding Service - DNS search-domain
# resolution fills in the rest. Use the full form for anything crossing a namespace boundary.
#
# Unlike docker-compose.yml's `depends_on: [embedding]`, there's no direct equivalent here -
# Kubernetes has no built-in "don't start container A until container B is ready" primitive
# between separate Deployments (only within one Pod, via init containers, which doesn't apply
# across Pods). In practice this doesn't matter much: Search's own health probes just fail
# (Ready: false) until the embedding container it depends on is reachable and responding, the
# same as it would for a temporarily-unreachable Postgres - see the comment on
# `builder.Services.AddHealthChecks()` in Search/Api/Program.cs for why that's a deliberate
# choice, not an oversight.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: webshop
  labels:
    app: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: search
      # See 10-catalog.yaml for what these mean. Search is both a Dapr callee (Web invokes it as
      # "search") and, via DaprServiceInvocation in its own Program.cs, a caller of "embedding" -
      # a sidecar handles both directions for one Pod, nothing extra needed for that.
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "search"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: search
          image: psrepo.azurecr.io/webshop-search:v7-cosmos
          ports:
            - name: http
              containerPort: 8080
          env:
            # Postgres wiring - commented out, not deleted (see 10-catalog.yaml for the full
            # explanation of this pattern). Search now runs on Cosmos.
            # - name: ConnectionStrings__Search
            #   valueFrom:
            #     secretKeyRef:
            #       name: webshop-postgres-connections
            #       key: ConnectionStrings__Search
            - name: CosmosDb__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: webshop-cosmos-connection
                  key: CosmosDb__ConnectionString
            # A plain hardcoded value, unlike everything sourced from the ConfigMap/Secrets
            # above - not every setting needs to be externalized through a ConfigMap; this one
            # is simple, non-secret, and specific to only this one Deployment, so a plain `value:`
            # is the least ceremony for the same result. Matches the "embedding" Service name +
            # its container port 8000 (not 8080 - the embedding container is Python/Uvicorn, not
            # ASP.NET Core, so it doesn't follow this repo's .NET services' port convention).
            - name: Embedding__Url
              value: "http://embedding:8000"
          envFrom:
            - configMapRef:
                name: webshop-common-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: webshop
spec:
  type: ClusterIP
  selector:
    app: search
  ports:
    - name: http
      port: 8080
      targetPort: http
