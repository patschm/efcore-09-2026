# Secrets hold the values that shouldn't be visible to just anyone who can read a ConfigMap or
# `kubectl describe` a Pod - database credentials, signing keys, API tokens. Kubernetes stores
# a Secret's values base64-ENCODED, not encrypted - base64 is trivially reversible
# (`echo '...' | base64 -d`), so a Secret only really protects its contents via Kubernetes' RBAC
# (who's allowed to `kubectl get secret`) and etcd encryption-at-rest (which AKS enables by
# default for the cluster's own storage). It's still meaningfully different from a ConfigMap:
# `kubectl get configmap -o yaml` prints values in the clear by default; `kubectl get secret -o
# yaml` shows only the base64 blob, and `kubectl describe secret` hides even that.
#
# IMPORTANT - REPLACE THE PLACEHOLDER VALUES BELOW before applying this file. They're written
# as `stringData` (plain text) rather than `data` (pre-base64-encoded) purely for readability -
# Kubernetes base64-encodes `stringData` into `data` for you the moment this is applied, so you
# never have to run `base64` by hand to fill this in.
#
# This file is also a bad place to keep real secrets once you're past learning/experimenting -
# it's plain YAML, so anything committed to git here is exposed to everyone with repo access
# forever (even after a later commit removes it - git history keeps it). Once this matters for
# real, look at:
#   - Azure Key Vault + the Secrets Store CSI driver (mounts Key Vault secrets as files/env vars
#     into pods, using the workload identity infra/main.bicep already enables on this cluster -
#     nothing in the cluster ever holds the actual secret value in etcd at all)
#   - Sealed Secrets or the External Secrets Operator (encrypt the secret so the *encrypted*
#     form is safe to commit, decrypted only inside the cluster)
# Plain Secrets, as written here, are the right starting point for learning what a Secret even
# is before reaching for those.
apiVersion: v1
kind: Secret
metadata:
  name: webshop-postgres-connections
  namespace: webshop
type: Opaque
stringData:
  # Keys match the .NET configuration binding convention exactly - ASP.NET Core's environment
  # variable provider treats "__" (double underscore) as a section separator, so the env var
  # ConnectionStrings__Catalog binds to configuration key "ConnectionStrings:Catalog", which
  # is exactly what `builder.Configuration.GetConnectionString("Catalog")` reads in
  # Catalog/Api/Program.cs. Same convention docker-compose.yml already uses locally.
  #
  # Catalog/Pricing/Reviews/Search now run on Cosmos DB instead (see webshop-cosmos-connection
  # below) - Postgres wiring for them is commented out here, not deleted, matching Program.cs/
  # the .csproj files/docker-compose.yml for the same services (see
  # feedback_comment_dont_delete_provider_code in project memory for why: an easy revert path).
  # Host=postgres - the headless Service in 04-postgres.yaml, same namespace, so the short
  # cluster-DNS name is enough (see 13-search.yaml's comment on short vs. fully-qualified Service
  # names). <POSTGRES_PASSWORD> still needs replacing - with whatever's actually set as
  # 04-postgres.yaml's webshop-postgres-admin Secret's POSTGRES_PASSWORD, since the two have to
  # agree by convention (nothing in Kubernetes links them automatically - see that file's comment).
  # ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=webshop;Username=postgres;Password=<POSTGRES_PASSWORD>"
  # ConnectionStrings__Pricing: "Host=postgres;Port=5432;Database=webshop;Username=postgres;Password=<POSTGRES_PASSWORD>"
  # ConnectionStrings__Reviews: "Host=postgres;Port=5432;Database=webshop;Username=postgres;Password=<POSTGRES_PASSWORD>"
  # ConnectionStrings__Search: "Host=postgres;Port=5432;Database=webshop;Username=postgres;Password=<POSTGRES_PASSWORD>"
  # Web's own Identity schema lives in the same physical database as the bounded contexts above
  # (see Web/Identity/ApplicationIdentityDbContext.cs's HasDefaultSchema("identity")) - same
  # connection string, different config key because Web reads it as "Identity", not a context name.
  # Postgres in this cluster (04-postgres.yaml) is now ONLY used for this - Web's own login/
  # Identity data - the same narrowing docker-compose.yml already went through locally.
  ConnectionStrings__Identity: "Host=postgres;Port=5432;Database=webshop;Username=postgres;Password=<POSTGRES_PASSWORD>"

---
# Catalog/Pricing/Reviews/Search's real datastore now - the same Azure Cosmos account
# (pscosmosdb) docker-compose.yml points at locally via WEBSHOP_COSMOS_CONNECTION. The database
# name itself isn't sensitive (it lives in 02-configmap.yaml, shared via envFrom like every other
# non-secret setting); only the connection string (it embeds the account's primary key) belongs
# in a Secret. REPLACE <COSMOS_ACCOUNT_NAME>/<COSMOS_ACCOUNT_KEY> before applying - get the real
# values with:
#   az cosmosdb keys list --name <account> --resource-group <rg> --query primaryMasterKey -o tsv
apiVersion: v1
kind: Secret
metadata:
  name: webshop-cosmos-connection
  namespace: webshop
type: Opaque
stringData:
  CosmosDb__ConnectionString: "AccountEndpoint=https://<COSMOS_ACCOUNT_NAME>.documents.azure.com:443/;AccountKey=<COSMOS_ACCOUNT_KEY>;"

---
# Shared between Web (which mints access tokens in Web/Identity/JwtTokenService.cs after a user
# logs in) and Reviews (which validates them in Reviews/Api/Program.cs's AddJwtBearer setup) -
# both sides need the exact same key, since there's no separate auth server here, just a shared
# secret the two services trust each other with.
#
# REPLACE SigningKey before applying - generate a real random one rather than reusing this
# placeholder or the dev-only value baked into Reviews/Api/appsettings.json and Web/appsettings.json
# (fine for a local docker-compose run on your own machine, not for anything reachable by anyone
# else). A quick way to generate 32 random bytes as base64:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: webshop-jwt-signing
  namespace: webshop
type: Opaque
stringData:
  SigningKey: "REPLACE_WITH_A_REAL_RANDOM_SIGNING_KEY"
  Issuer: "WebShop.Web"
  Audience: "WebShop.Reviews"
